<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Space</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
font-family:'Poppins',sans-serif;
color:white;
position:relative;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:url('background.jpg') center/cover no-repeat;
filter:blur(14px);
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
z-index:-1;
}

.container{
width:100%;
max-width:700px;
background:rgba(0,0,0,.92);
padding:40px;
border-radius:24px;
}

.title{
font-family:'Cormorant Garamond',serif;
font-size:52px;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
opacity:.6;
margin-bottom:40px;
}

.card{
display:block;
padding:20px;
margin-bottom:15px;
border-radius:16px;
background:#111;
color:white;
text-decoration:none;
transition:.3s;
}

.card:hover{
transform:translateY(-2px);
box-shadow:0 0 20px rgba(255,255,255,.12);
}

.card-title{
font-size:18px;
margin-bottom:5px;
}

.card-date{
opacity:.5;
font-size:13px;
}

.footer{
margin-top:30px;
text-align:center;
opacity:.4;
font-size:12px;
}

</style>
</head>
<body>

<div class="container">

<div class="title">
Our Little Space
</div>

<div class="subtitle">
A collection of moments, memories and letters.
</div>

<a href="first-monthsary.html" class="card">
<div class="card-title">💌 First Monthsary</div>
<div class="card-date">June 2026</div>
</a>

<!-- Add more letters here later -->

<div class="footer">
Made with love.
</div>

</div>

</body>
</html>
