<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Space</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
background:#000;
}

body{
background:#000;
min-height:100vh;
padding:30px;
font-family:Georgia, "Times New Roman", serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
}

/* Main Container */

.container{
width:100%;
max-width:700px;
background:#000;
padding:40px;
border-radius:24px;
border:1px solid #151515;
box-shadow:0 0 25px rgba(255,255,255,0.03);
}

/* Title */

.title{
font-family:Georgia, "Times New Roman", serif;
font-size:30px;
text-align:center;
margin-bottom:10px;
}

.subtitle{
font-family:Georgia, "Times New Roman", serif;
text-align:center;
opacity:.6;
margin-bottom:40px;
}

/* Letter Buttons */

.card{
display:block;
padding:20px;
margin-bottom:15px;
border-radius:16px;
background:#0d0d0d;
border:1px solid #1a1a1a;
color:white;
text-decoration:none;
transition:.3s;
}

.card:hover{
transform:translateY(-2px);
border-color:#4d4d4d;
box-shadow:
0 0 15px rgba(255,255,255,.15),
0 0 30px rgba(255,255,255,.05);
}

.card-title{
font-size:10px;
margin-bottom:5px;
}

.card-date{
opacity:.5;
font-size:9px;
}

.footer{
margin-top:30px;
text-align:center;
opacity:.4;
font-size:12px;
}

</style>
</head>
<body>

<div class="container">

<div class="title">
Our Little Space
</div>

<div class="subtitle">
A collection of moments, memories and letters.
</div>

<a href="first-monthsary.html" class="card">
<div class="card-title">💌 First Monthsary</div>
<div class="card-date">May 14 2026</div>
</a>

<a href="second-monthsary.html" class="card">
<div class="card-title">💌 Second Monthsary</div>
<div class="card-date">Jun 14 2026</div>
</a>

<a href="third-monthsary.html" class="card">
<div class="card-title">💌 Third Monthsary</div>
<div class="card-date">July 14 2026</div>
</a>

<div class="footer">
Made with love.
</div>

</div>

</body>
</html>
